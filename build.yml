name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          py -3.13 -m pip install --upgrade pip
          py -3.13 -m pip install -r requirements.txt pyinstaller

      - name: Run protocol tests
        run: |
          cd petruzia_usb_studio
          py -3.13 test_protocol.py

      - name: Build EXE
        run: |
          py -3.13 -m PyInstaller --noconfirm --clean --onefile --windowed `
            --icon petruzia_usb_studio/icon.ico `
            --add-data "petruzia_usb_studio/icon.ico;." `
            --name PetruziaUSBStudio petruzia_usb_studio/app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetruziaUSBStudio
          path: dist/PetruziaUSBStudio.exe

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PetruziaUSBStudio.exe
